
spring.application.name=payment-service

server.port=8081

# ===========================================================
# 2. Database Configuration (MySQL)
# ===========================================================
# الربط مع الحاوية في دوكر أو localhost
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Password}

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===========================================================
# 3. Kafka Consumer Configuration (الأهم لاستقبال الأوردرات)
# ===========================================================
# عنوان سيرفر كافكا
spring.kafka.bootstrap-servers=kafka:29092

# إعدادات الـ Consumer
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.auto-offset-reset=earliest

# معالجة الـ Serialization لضمان تحويل الـ JSON لكائنات Java
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# الوثوق في الحزم وتحديد النوع الافتراضي للبيانات المستلمة
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.Map

# ===========================================================
# 4. Eureka Discovery Configuration
# ===========================================================
eureka.client.serviceUrl.defaultZone=http://discovery-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ===========================================================
# 5. Security & Payment (Stripe)
# ===========================================================
stripe.secret.key=sk_test_placeholder_for_tests
stripe.webhook.secret=whsec_test_placeholder

internal.gateway.secret=MySuperSecretKey123
# إعدادات الـ JWT (تأكد من تشغيل خدمة الهوية على بورت 8083)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://identity-service:8083/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://identity-service:8083

# ===========================================================
# 6. Monitoring & Logs
# ===========================================================
management.endpoints.web.exposure.include=health,info
management.health.defaults.enabled=true

logging.level.com.foodordering.payment=DEBUG
logging.level.org.springframework.kafka=INFO