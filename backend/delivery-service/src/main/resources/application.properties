# Server Configuration
server.port=8084

# Database Configuration
spring.datasource.url=jdbc:mysql://mysql:3306/delivery_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Application Configuration
spring.application.name=delivery-service

# Eureka Configuration (if using service discovery)
eureka.client.service-url.default-zone=http://discovery-server:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# Feign Configuration
feign.hystrix.enabled=true
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000

# Logging
logging.level.com.foodordering.delivery=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG

internal.gateway.secret=MySuperSecretKey123

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://restaurant-service:8083/.well-known/jwks.json
