spring.application.name=payment-service
server.port=8082

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Stripe Configuration
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_51TNkmZLaPu9ajsblgH9mkHH3tgWrbSwN9yWYOWxXd9vjnG11rqNDurmZrE9428QBMxPFHOJ8p10vQof08g1wMHea00cnQNf6Z3}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_e94e4d18b68de95456369b80948a9b3fe04a91ac8a2ad7c283cd38ae30f405c8}

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Gateway internal-auth header. Keep this in sync with api-gateway AuthenticationFilter.
internal.gateway.secret=${INTERNAL_GATEWAY_SECRET:MySuperSecretKey123}

# OAuth2 Resource Server Configuration for direct service calls.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_SERVICE_JWK_URI:http://localhost:8083/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_SERVICE_ISSUER_URI:http://localhost:8083}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.health.defaults.enabled=true

# Logging Configuration
logging.level.com.foodordering.payment=INFO
logging.level.org.springframework.security=INFO
