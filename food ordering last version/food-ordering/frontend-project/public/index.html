<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

<!-- 📱 Responsive -->
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- 🎨 Theme -->
<meta name="theme-color" content="#ff4d4f" />

<!-- 🧠 SEO -->
<meta
  name="description"
  content="Mazboot - Smart Food Ordering System. Order your favorite meals easily and quickly."
/>

<!-- 🍏 Apple -->
<link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

<!-- 📦 Manifest -->
<link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

<!-- 🔥 Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<title>Mazboot | Food Ordering System 🍔</title>

<style>


  #loading {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-size: 24px;
    color: #ff4d4f;
    font-weight: bold;
  }
</style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Mazboot.</noscript>

<!-- 🌀 Loading Screen -->
<div id="loading">🍔 Loading Mazboot...</div>

<!-- ⚛️ React Root -->
<div id="root"></div>

<script>
  // Remove loading when React loads
  window.addEventListener("load", () => {
    const loading = document.getElementById("loading");
    if (loading) loading.style.display = "none";
  });
</script>


  </body>
</html>
